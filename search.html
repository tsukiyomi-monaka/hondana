にだけ急に塩対応になる、おとめ座。", "u": "https://note.com/stardust104/n/na58d524acc0b", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318886751/rectangle_large_type_2_351d20fe285bacbb112b784afd4afffa.png?fit=bounds&quality=85&width=1280"}, {"t": "【おうし座】2027年の運勢｜恋愛・仕事・お金・人間関係を前半と後半で徹底解説", "u": "https://note.com/stardust104/n/n07f898160300", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319912336/rectangle_large_type_2_555d31cc2bb517da60d6b195ba885a94.png?fit=bounds&quality=85&width=1280"}, {"t": "さそり座が執念深いと言われる理由、深く愛しすぎる星だから仕方ない。", "u": "https://note.com/stardust104/n/nfa49404ff474", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/320013632/rectangle_large_type_2_3f50ec6fd4df40142515838f6986f299.png?fit=bounds&quality=85&width=1280"}, {"t": "【やぎ座】実は一番甘えたい星座", "u": "https://note.com/stardust104/n/ne41cfffbe3fd", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/320014604/rectangle_large_type_2_4d7e75cf49fac64968b7061aaf7880f7.png?fit=bounds&quality=85&width=1280"}, {"t": "【やぎ座】2027年の運勢｜恋愛・仕事・お金・人間関係を前半と後半で徹底解説", "u": "https://note.com/stardust104/n/n204ee56ee708", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/320232845/rectangle_large_type_2_39f7312adb36415eef414f5dfb9a8d21.png?fit=bounds&quality=85&width=1280"}, {"t": "【うお座】実は一番限界を隠す星座", "u": "https://note.com/stardust104/n/ne01e3bc5df2a", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319992904/rectangle_large_type_2_7c14fef33cc9a6133eae0680bd4d1407.png?fit=bounds&quality=85&width=1280"}, {"t": "【てんびん座】実は一番ひとりで抱える星座", "u": "https://note.com/stardust104/n/n36da9be76d23", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314211072/rectangle_large_type_2_440f5e9b49a849745f58c5866b162a77.png?fit=bounds&quality=85&width=1280"}, {"t": "【おとめ座】愛情で言ってるのに、「うるさい」って思われてる気がする。", "u": "https://note.com/stardust104/n/n2a2f536dc7d2", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314210640/rectangle_large_type_2_42a4348e844b52398b289581b655c62d.png?fit=bounds&quality=85&width=1280"}, {"t": "【ふたご座】2027年の運勢｜恋愛・仕事・お金・人間関係を前半と後半で徹底解説", "u": "https://note.com/stardust104/n/n00eb6e839430", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319911182/rectangle_large_type_2_0bbb02d582b8b419068ccfd3ac1851ef.png?fit=bounds&quality=85&width=1280"}, {"t": "恋人がおひつじ座のあなたへ。本当の取扱説明書。", "u": "https://note.com/stardust104/n/nb7abc9bc9887", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318894519/rectangle_large_type_2_be36c856231935cd5375b932ed4cfe4d.png?fit=bounds&quality=85&width=1280"}, {"t": "近づいたと思ったら、また遠くなった。蠍座が「離れる前に必ず出すサイン」を知っていますか？", "u": "https://note.com/stardust104/n/n57ce724aada7", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314514074/rectangle_large_type_2_7d65c4ed936bfaefcfc6e2ee98400177.png?fit=bounds&quality=85&width=1280"}, {"t": "「細かいことをいちいち言ってくる」と思っていたら、それが愛情表現だった。乙女座の本音。", "u": "https://note.com/stardust104/n/n1a37ca848fcd", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314513741/rectangle_large_type_2_4b673ef55953f952a5baa40549ab9f4b.png?fit=bounds&quality=85&width=1280"}, {"t": "【保存版・おひつじ座のあなたへ】あなたの愛は「炎」？その情熱的な恋愛観、本音、セックス、攻略法を徹底解説", "u": "https://note.com/stardust104/n/n612ec19d23c9", "p": 4850, "e": "https://assets.st-note.com/production/uploads/images/329151006/rectangle_large_type_2_107378f2a84059b667eddef3a9a81c28.png?fit=bounds&quality=85&width=1280"}, {"t": "「好き」って一言も言ってくれないのに、気づいたら10年一緒にいた。山羊座の愛し方。", "u": "https://note.com/stardust104/n/n74156281fd5d", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314602475/rectangle_large_type_2_deb21a1232dbd8b4ee8af54ad8c471ff.png?fit=bounds&quality=85&width=1280"}, {"t": "【おひつじ座】「また冷めた」って思われるのが、もう嫌だ。", "u": "https://note.com/stardust104/n/nb4ec4de4bd51", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318894351/rectangle_large_type_2_f70654993d4b2579c50522aa3d0704ff.png?fit=bounds&quality=85&width=1280"}, {"t": "実は浮気性ですぐ異性と遊びに行っちゃう、ふたご座。", "u": "https://note.com/stardust104/n/n23e284b0e382", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314513774/rectangle_large_type_2_abe9e762ed878bc512859c90669e2145.png?fit=bounds&quality=85&width=1280"}, {"t": "恋人がうお座のあなたへ。本当の取扱説明書。", "u": "https://note.com/stardust104/n/n01a6a0a2f133", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/313982812/rectangle_large_type_2_1aaa4a4dc71265b3a6a766c7252bb289.png?fit=bounds&quality=85&width=1280"}, {"t": "【おうし座】「動かない」んじゃなくて、「ちゃんと確かめてから」動きたいだけ。", "u": "https://note.com/stardust104/n/neb8daa601905", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319993721/rectangle_large_type_2_be557ea9afbce30eda32c37c7e41bf8f.png?fit=bounds&quality=85&width=1280"}, {"t": "【みずがめ座】2027年の恋愛運と、好きな人との1年｜月別の山と谷・距離が動く時期を保存版で徹底解説", "u": "https://note.com/stardust104/n/n345c0716bd47", "p": 1980, "e": "https://assets.st-note.com/production/uploads/images/319911212/rectangle_large_type_2_5461a12a37151aa1bc62ba713c25d5c2.png?fit=bounds&quality=85&width=1280"}, {"t": "恋人がさそり座のあなたへ。本当の取扱説明書。", "u": "https://note.com/stardust104/n/nd981c528b0d2", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319187433/rectangle_large_type_2_cf347c0c40428ad35f4624f5dda8ba82.png?fit=bounds&quality=85&width=1280"}, {"t": "好きなのに、連絡できない。", "u": "https://note.com/stardust104/n/nb6900e1e52f7", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318894495/rectangle_large_type_2_e379b50774f4193f15da835c391e4b88.png?fit=bounds&quality=85&width=1280"}, {"t": "【かに座】実は一番諦めが悪い星座", "u": "https://note.com/stardust104/n/nc811a60326ba", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319139344/rectangle_large_type_2_7824a2bfaac6670272a047749097907c.png?fit=bounds&quality=85&width=1280"}, {"t": "【保存版・相手編】好きな人がおうし座のあなたへ。｜おうし座徹底解説", "u": "https://note.com/stardust104/n/nedaba7c32094", "p": 4850, "e": "https://assets.st-note.com/production/uploads/images/329274746/rectangle_large_type_2_e8ac5bc572619300a4b6b8d3b9e9b500.png?fit=bounds&quality=85&width=1280"}, {"t": "【いて座】2027年の運勢｜恋愛・仕事・お金・人間関係を前半と後半で徹底解説", "u": "https://note.com/stardust104/n/n96d98f81048b", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/320233153/rectangle_large_type_2_e512a86f1ad05f786d8482dd11f8145e.png?fit=bounds&quality=85&width=1280"}, {"t": "恋人がかに座のあなたへ。本当の取扱説明書。", "u": "https://note.com/stardust104/n/n5bdc70467004", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314371504/rectangle_large_type_2_4cb696dcd92dd28a579eabafe1c5175c.png?fit=bounds&quality=85&width=1280"}, {"t": "【保存版・相手編】好きな人がおとめ座のあなたへ。｜おとめ座徹底解説", "u": "https://note.com/stardust104/n/n81c5b19a41d5", "p": 4850, "e": "https://assets.st-note.com/production/uploads/images/329151195/rectangle_large_type_2_719c4269f8288043af3b809abdbc3b47.png?fit=bounds&quality=85&width=1280"}, {"t": "かに座が心配性な理由、愛が深すぎるせいでした。", "u": "https://note.com/stardust104/n/nf449376c8d54", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/320013337/rectangle_large_type_2_a0285e3dfc2dd6134c35931745d7beeb.png?fit=bounds&quality=85&width=1280"}, {"t": "ふたご座が飽きっぽいと言われる理由、2つの自分がいるから仕方ない。", "u": "https://note.com/stardust104/n/nd8d7b7b4990a", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319187400/rectangle_large_type_2_e76454d28eb4a372eadc0b0a43dc162b.png?fit=bounds&quality=85&width=1280"}, {"t": "【うお座】2027年の恋愛運と、好きな人との1年｜月別の山と谷・距離が動く時期を保存版で徹底解説", "u": "https://note.com/stardust104/n/nf406a093b5bf", "p": 1980, "e": "https://assets.st-note.com/production/uploads/images/320664091/rectangle_large_type_2_a478d7e611c7051f099432817fb4c2f4.png?fit=bounds&quality=85&width=1280"}, {"t": "【おひつじ座】2027年の運勢｜恋愛・仕事・お金・人間関係を前半と後半で徹底解説", "u": "https://note.com/stardust104/n/nc47684325119", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319983372/rectangle_large_type_2_102b6647f3061df5739a23acc4917632.png?fit=bounds&quality=85&width=1280"}, {"t": "「好きだよ」と言ってくれるのに、全然捕まらない。射手座が自分から戻ってくる距離感の作り方。", "u": "https://note.com/stardust104/n/ne2096c18c6bc", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319993018/rectangle_large_type_2_7dbc3e2472280b0a655b27c6227f4e7b.png?fit=bounds&quality=85&width=1280"}, {"t": "実は恋愛中に自分を見失いがち、うお座。", "u": "https://note.com/stardust104/n/n536eddfcfad8", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314514043/rectangle_large_type_2_5a3a9621fb1c53f6911650207c0dd4b3.png?fit=bounds&quality=85&width=1280"}, {"t": "他の異性を褒めたら、急に機嫌が悪くなった。獅子座のプライドを傷つけずに関わる方法。", "u": "https://note.com/stardust104/n/n8d72ba8f4035", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318885786/rectangle_large_type_2_d82ad25b746f87f60c5e0f37f0de1459.png?fit=bounds&quality=85&width=1280"}, {"t": "実は振った後に後悔しがち、てんびん座。", "u": "https://note.com/stardust104/n/ne35014eb2f53", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319993147/rectangle_large_type_2_1bda440db93e14946630bceab8bfe2fb.png?fit=bounds&quality=85&width=1280"}, {"t": "【保存版】12星座トリセツ｜12星座それぞれの性格・恋愛傾向・取扱い方を徹底解説", "u": "https://note.com/stardust104/n/n9983b170fa28", "p": 2000, "e": "https://assets.st-note.com/production/uploads/images/318886246/rectangle_large_type_2_d403c393bd003b3a9bc4683c03366dc6.png?fit=bounds&quality=85&width=1280"}, {"t": "ケンカが続いてる。仲直りしたいのに、方法がわからない。", "u": "https://note.com/stardust104/n/n4129a5dc43d7", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314513989/rectangle_large_type_2_918107811eb17d2a9adbef8a0030c291.png?fit=bounds&quality=85&width=1280"}, {"t": "はじめての方へ｜星くずモナカとは？", "u": "https://note.com/stardust104/n/n4409a2f26067", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318661551/rectangle_large_type_2_513785c8daddbe5c27d6d1189a6e3456.png?fit=bounds&quality=85&width=1280"}, {"t": "【ふたご座】実は一番寂しがりな星座", "u": "https://note.com/stardust104/n/n015c9f5df413", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314210402/rectangle_large_type_2_7b6c09bac158d86a2da2a8161464e654.png?fit=bounds&quality=85&width=1280"}, {"t": "【おとめ座】2027年の恋愛運と、好きな人との1年｜月別の山と谷・距離が動く時期を保存版で徹底解説", "u": "https://note.com/stardust104/n/n1cc0c4b3173c", "p": 1980, "e": "https://assets.st-note.com/production/uploads/images/320088212/rectangle_large_type_2_01ce2ddb7bcaa81e756d8f75c980c4aa.png?fit=bounds&quality=85&width=1280"}, {"t": "【しし座】実は一番傷つきやすい星座", "u": "https://note.com/stardust104/n/ncc332c465be6", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/319139372/rectangle_large_type_2_0c5c96d7ae00cd0eb40dd4e15396ee7a.png?fit=bounds&quality=85&width=1280"}, {"t": "【しし座】2027年の運勢｜恋愛・仕事・お金・人間関係を前半と後半で徹底解説", "u": "https://note.com/stardust104/n/ne80c07ddfb0a", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/320663576/rectangle_large_type_2_e707ca748777e29303b0385f531d3635.png?fit=bounds&quality=85&width=1280"}, {"t": "【おとめ座】実は一番自分を責める星座", "u": "https://note.com/stardust104/n/n19668a6bb95b", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314228505/rectangle_large_type_2_7f15bf2ea8eab4ccf23081da584f9436.png?fit=bounds&quality=85&width=1280"}, {"t": "【てんびん座】2027年の恋愛運と、好きな人との1年｜月別の山と谷・距離が動く時期を保存版で徹底解説", "u": "https://note.com/stardust104/n/ndb86d9442b18", "p": 1980, "e": "https://assets.st-note.com/production/uploads/images/320663331/rectangle_large_type_2_8c32be8dcf0c2d810ef50e09971e9f33.png?fit=bounds&quality=85&width=1280"}, {"t": "いて座がじっとできない理由、自由を求める星に生まれたから仕方ない。", "u": "https://note.com/stardust104/n/n29675bb79667", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314513839/rectangle_large_type_2_dfbd43414def1b4abb5dd2d668430700.png?fit=bounds&quality=85&width=1280"}, {"t": "【相手の月星座の見抜き方】生まれた時間なんて、聞けないですよね。", "u": "https://note.com/stardust104/n/n467106db97d8", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318661564/rectangle_large_type_2_513e9146651e8822f5da0ac957b58c3e.png?fit=bounds&quality=85&width=1280"}, {"t": "追いかけるのをやめたい。でも、やめられない。", "u": "https://note.com/stardust104/n/n69302301cf1d", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314514192/rectangle_large_type_2_c2a94655966554e87ec1a601f009e0bf.png?fit=bounds&quality=85&width=1280"}, {"t": "昨日はあんなに楽しそうだったのに、今日は急にそっけない。双子座に振り回されてるあなたへ。", "u": "https://note.com/stardust104/n/n8ac35cc0ce41", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318885700/rectangle_large_type_2_72fd75c34e3a197754853f6420bedf15.png?fit=bounds&quality=85&width=1280"}, {"t": "【月星座の調べ方】太陽星座で調べても、しっくりこなかった人へ。", "u": "https://note.com/stardust104/n/n15526ec5da4c", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/315224420/rectangle_large_type_2_8e0ae72dd4fbbcf68c1b700ad150bb37.png?fit=bounds&quality=85&width=1280"}, {"t": "【しし座】「自己中」って思われてるのかな、ってずっと気になってた。", "u": "https://note.com/stardust104/n/nf5b813e67273", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/320013377/rectangle_large_type_2_2656ef25e643599a11167de8a6463985.png?fit=bounds&quality=85&width=1280"}, {"t": "恋人がおとめ座のあなたへ。本当の取扱説明書。", "u": "https://note.com/stardust104/n/n4a4105a694dc", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314326329/rectangle_large_type_2_ed9b3fdda92752e168774ffe5716d5dd.png?fit=bounds&quality=85&width=1280"}, {"t": "恋人がふたご座のあなたへ。本当の取扱説明書。", "u": "https://note.com/stardust104/n/n9112a1974fc8", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318885971/rectangle_large_type_2_19fc902ee7d8804e794fd0015085b889.png?fit=bounds&quality=85&width=1280"}, {"t": "また連絡してしまいそう。復縁したいとき、星座別にやっていいこととやってはいけないことが全然違う話。", "u": "https://note.com/stardust104/n/n936bd79cdc17", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318886088/rectangle_large_type_2_e92ffa5229ae1b244a48ad8daa75fba3.png?fit=bounds&quality=85&width=1280"}, {"t": "恋人がてんびん座のあなたへ。本当の取扱説明書。", "u": "https://note.com/stardust104/n/n98877a9b06a4", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318886207/rectangle_large_type_2_235c0ae3ca496cd1883c5e35bea44100.png?fit=bounds&quality=85&width=1280"}, {"t": "付き合ってるのに、なんか孤独。この気持ち、おかしいのかな。", "u": "https://note.com/stardust104/n/n6da82c02ef72", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/314554129/rectangle_large_type_2_8bb3a4d00c568ef0219fbb4bd4042544.png?fit=bounds&quality=85&width=1280"}, {"t": "【おうし座】2027年の恋愛運と、好きな人との1年｜月別の山と谷・距離が動く時期を保存版で徹底解説", "u": "https://note.com/stardust104/n/n74434c232be6", "p": 1980, "e": "https://assets.st-note.com/production/uploads/images/320233020/rectangle_large_type_2_0699a56822df9a15634a73612e858fca.png?fit=bounds&quality=85&width=1280"}, {"t": "【おうし座】実は一番長く根に持つ星座", "u": "https://note.com/stardust104/n/n8f435adb47a0", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318885892/rectangle_large_type_2_28f61426fe3ea6d2f543ef277d41eb16.png?fit=bounds&quality=85&width=1280"}, {"t": "強がってるのに、ひとことで傷ついてる。牡羊座が絶対に言わないこと。", "u": "https://note.com/stardust104/n/nb50f33af196a", "p": 0, "e": "https://assets.st-note.com/production/uploads/images/318894436/rectangle_large_type_2_4646d76a293694968751954e4ff65f24.png?fit=bounds&quality=85&width=1280"}, {"t": "【保存版・相手編】好きな人がさそり座のあなたへ。友達以上から付き合う告白｜さそり座の脈ありサイン・告白のタイミング・言い方・NGを徹底解説", "u": "https://note.com/stardust104/n/n11fc9cc25cb7", "p": 1000, "e": "https://assets.st-note.com/production/uploads/images/313848725/rectangle_large_type_2_1c1a0104736236cc45e65468fca3c769.png?fit=bounds&quality=85&width=1280"}, {"t": "【ふたご座】2027年の恋愛運と、好きな人との1年｜月別の山と谷・距離が動く時期を保存版で徹底解説", "u": "https://note.com/stardust104/n/n4004bec39ad5", "p": 1980, "e": "https://assets.st-note.com/production/uploads/images/320088251/rectangle_large_type_2_64c8b49ea45ad8c0574c9f0a672ed1c3.png?fit=bounds&quality=85&width=1280"}, {"t": "【保存版・復縁完全版】冷却期間中のあなたへ。｜連絡しない期間の過ごし方・終わらせる日の決め方・我慢できない夜の手順を徹底解説", "u": "https://note.com/stardust104/n/n491ac486580f", "p": 1980, "e": "https://assets.st
